<!DOCTYPE html>
<html lang="uk">

<head>

    <!-- Кодування символів -->
    <meta charset="UTF-8">

    <!-- Адаптивність для мобільних пристроїв -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Назва сторінки -->
    <title>TickTask PRO</title>

    <!-- Підключення CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Підключення шрифту Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Іконки RemixIcon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body>

    <!-- Основний контейнер додатку -->
    <div class="app">


        <header>

            <!-- Назва додатку -->
            <h1>TickTask</h1>

            <!-- Кнопка зміни теми -->
            <button id="theme">

                <!-- Іконка місяця -->
                <i class="ri-moon-line"></i>

            </button>

        </header>


        <div class="pomodoro">

            <!-- Кнопки режимів таймера -->
            <div class="modes">

                <!-- Режим фокусування -->
                <button class="mode-btn active" data-mode="focus">
                    Фокус
                </button>

                <!-- Коротка перерва -->
                <button class="mode-btn" data-mode="short">
                    Перерва
                </button>

                <!-- Довга перерва -->
                <button class="mode-btn" data-mode="long">
                    Довга
                </button>

            </div>


            <!-- Блок таймера -->
            <div class="timer-wrapper">

                <!-- Відображення часу -->
                <div id="time">25:00</div>

                <!-- Input для ручної зміни часу -->
                <input id="time-input"
                       type="number"
                       class="hidden">

            </div>


            <!-- Кнопки управління таймером -->
            <div class="controls">

                <!-- Кнопка старт/пауза -->
                <button id="start">

                    <i class="ri-play-fill"></i>

                </button>

                <!-- Кнопка reset -->
                <button id="reset">

                    <i class="ri-refresh-line"></i>

                </button>

            </div>


            <!-- Progress bar -->
            <div class="progress">

                <!-- Заповнення progress bar -->
                <div id="progress-bar"></div>

            </div>


            <!-- Лічильник завершених сесій -->
            <p>

                Сесій:
                <span id="sessions">0</span>

            </p>

        </div>


        <!-- Поле пошуку задач -->
        <input id="search"
               placeholder="Пошук...">


        <form id="form">

            <!-- Введення тексту задачі -->
            <input id="input"
                   placeholder="Нове завдання..."
                   required>

            <!-- Вибір пріоритету -->
            <select id="priority">

                <option value="low">
                    Low
                </option>

                <option value="medium" selected>
                    Medium
                </option>

                <option value="high">
                    High
                </option>

            </select>

            <!-- Вибір дедлайну -->
            <input type="date"
                   id="deadline">

            <!-- Кнопка додавання -->
            <button>

                +

            </button>

        </form>


        <div class="filters">

            <!-- Всі задачі -->
            <button data-f="all"
                    class="active">

                Всі

            </button>

            <!-- Активні -->
            <button data-f="active">

                Активні

            </button>

            <!-- Виконані -->
            <button data-f="done">

                Виконані

            </button>

        </div>


        <!-- Сюди JavaScript додає задачі -->
        <ul id="list"></ul>


        <!-- Повідомлення при відсутності задач -->
        <div id="empty">

            Немає задач 😴

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
